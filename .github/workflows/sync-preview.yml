name: Sync ERA preview

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - ".github/workflows/sync-preview.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch static export from marketplace preview branch
        run: |
          rm -rf /tmp/preview
          git clone --depth 1 --branch preview https://github.com/airway/bnb-era-marketplace.git /tmp/preview
          # Keep workflow; replace site files
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/preview/. ./
          rm -rf .git
          # restore this repo git? checkout already has .git — do not delete .git above
          touch .nojekyll
          printf 'include:\n  - _next\n  - .nojekyll\n' > _config.yml
      - name: Commit
        run: |
          git config user.name "ERA Marketplace"
          git config user.email "era@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Sync static preview from airway/bnb-era-marketplace@preview (139a442)"
          git push
